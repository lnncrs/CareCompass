[project]
name = "carecompass-backend"
version = "0.1.0"
description = "API acadêmica do Care Compass."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0,<1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "pydantic-settings>=2.14.2,<3",
    "uvicorn[standard]>=0.49.0,<1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.28.1,<1", "pyright>=1.1.411,<2", "pytest>=9.1.1,<10", "ruff>=0.15.20,<1"]
notebook = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "python-dotenv>=1.2.4",
]

[tool.uv.build-backend]
module-name = "app"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
